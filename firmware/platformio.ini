; PlatformIO project configuration for the HEXAFLAME stepper firmware.
;
; A single source tree builds for two very different targets:
;
;   env:rp2040            - Raspberry Pi RP2040 (the original single-channel
;                           HEXAFLAME valve controller). Step pulses come from
;                           the PIO; the TMC2209 talks over a hardware UART.
;
;   env:octopus_pro_h723  - BIGTREETECH Octopus Pro V1.1 (STM32H723ZET6).
;                           Eight independent channels. Step pulses come from
;                           per-channel hardware timers; each TMC2209 talks
;                           over its own single-wire SoftwareSerial UART.
;
;   env:octopus_pro_f446  - Octopus Pro / Octopus V1.1 with the STM32F446ZET6
;                           variant. Same firmware, same pin map.
;
; Platform-specific code lives under src/rp2040/ and src/stm32/; build_src_filter
; keeps the other platform's translation units out of each build.

[platformio]
default_envs = octopus_pro_h723

; ===========================================================================
; RP2040 - single channel
; ===========================================================================
[env:rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_src_filter = +<*> -<stm32/>
build_flags =
  -D BOARD_RP2040
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.5

; ===========================================================================
; Octopus Pro V1.1 - STM32H723ZET6 - eight channels
; ===========================================================================
; nucleo_h723zg is the closest in-registry match for the Octopus Pro's
; STM32H723ZET6 (same die family, 144-pin LQFP). The STM32H7 USB core only
; supports High-Speed operation, so it is enabled in "High Speed in Full
; Speed mode" (the HS peripheral driving the internal FS PHY on the USB-C
; connector).
;
; NOTE: this env uses the Nucleo H723ZG variant, which hard-codes HSE_VALUE to
; 8 MHz (the Nucleo's ST-Link MCO). A real Octopus Pro V1.1 clocks HSE from an
; on-board crystal (commonly 25 MHz); for production hardware add a board
; variant with the correct HSE_VALUE so the USB/timer clocks are exact.
;
; The BTT bootloader on the H723 Octopus Pro occupies the first 128 KiB of
; flash and hands off to the application at 0x08020000.
[env:octopus_pro_h723]
platform = ststm32@^17.0.0
board = nucleo_h723zg
framework = arduino
monitor_speed = 115200
upload_protocol = dfu
build_src_filter = +<*> -<rp2040/>
board_build.flash_offset = 0x20000
board_upload.offset_address = 0x08020000
build_flags =
  -D BOARD_OCTOPUS
  -D BOARD_OCTOPUS_H723
  -D USBCON
  -D USBD_USE_CDC
  -D USE_USB_HS
  -D USE_USB_HS_IN_FS
  -D USBD_VID=0x0483
  -D USBD_PID=0x5740
  -D USB_MANUFACTURER="\"BTT\""
  -D USB_PRODUCT="\"Octopus-Pro-Stepper\""
  -D HAL_TIM_MODULE_ENABLED
  -D HAL_PCD_MODULE_ENABLED
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
  -std=gnu++17
  -Os

; ===========================================================================
; Octopus Pro / Octopus V1.1 - STM32F446ZET6 variant - eight channels
; ===========================================================================
; nucleo_f446ze is the closest in-registry match for the STM32F446ZET6. The
; board JSON ships a case-mangled variant path on case-sensitive filesystems;
; the variant override below points at the correct directory.
[env:octopus_pro_f446]
platform = ststm32@^17.0.0
board = nucleo_f446ze
framework = arduino
monitor_speed = 115200
upload_protocol = dfu
build_src_filter = +<*> -<rp2040/>
board_build.variant = STM32F4xx/F446Z(C-E)(H-J-T)
board_build.variant_h = variant_NUCLEO_F446ZE.h
board_build.flash_offset = 0x8000
board_upload.offset_address = 0x08008000
build_flags =
  -D BOARD_OCTOPUS
  -D BOARD_OCTOPUS_F446
  -D STM32F446xx
  -D USBCON
  -D USBD_USE_CDC
  -D USBD_VID=0x0483
  -D USBD_PID=0x5740
  -D USB_MANUFACTURER="\"BTT\""
  -D USB_PRODUCT="\"Octopus-Pro-Stepper\""
  -D HAL_TIM_MODULE_ENABLED
  -D HAL_PCD_MODULE_ENABLED
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
  -D HSE_VALUE=12000000U
  -std=gnu++17
  -Os
