; PlatformIO project configuration for the HEXAFLAME solenoid firmware.
;
;   env:feather_esp32s3 - Adafruit ESP32-S3 Feather driving up to eight
;                         Adafruit "I2C to 8 Channel Solenoid Driver" boards
;                         (MCP23017 + AO3406 MOSFETs) over STEMMA QT / I2C.
;
; Host link: native USB CDC (TinyUSB). The device speaks Modbus RTU with the
; WaveShare "Modbus RTU Relay 32CH" register map, so HEXAFLAME's existing
; relay driver talks to it unchanged. The protocol lives in
; lib/hexaflame_link and only depends on two small interfaces, so it can be
; lifted into other device firmware or replaced by a purpose-built protocol.
;
; Optional build flags (add to build_flags):
;   -D HEXAFLAME_LINK_UART=1      Modbus over the Feather's TX/RX header pins
;                                 (Serial1) instead of USB CDC. Baud/parity
;                                 come from the Modbus 0x2000 register.
;   -D HEXAFLAME_DEBUG_LOG=1      Human-readable log on Serial1 (TX/RX pins).
;                                 Only meaningful with the USB link.
;   -D HEXAFLAME_LINK_WATCHDOG_MS=5000
;                                 Switch every output off when no valid frame
;                                 has arrived for this long. Off by default
;                                 because HEXAFLAME only sends state changes.
;   -D HEXAFLAME_ALL_OFF_ON_DISCONNECT=0
;                                 Keep outputs as they are when the host
;                                 closes the USB port (default: all off).

[platformio]
default_envs = feather_esp32s3

; Built and tested with pioarduino platform-espressif32 55.03.31 (arduino-esp32
; 3.3.12). The registry espressif32 6.x (arduino-esp32 2.0.x) is also
; supported by the sources; pin the platform here if builds must match.
[env:feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=0
  -D HEXAFLAME_FIRMWARE_VERSION=100
  -Wall
  -Wextra
